<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    body{
      margin:0;
      background:#111827;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:white;
      font-family:Arial;
      flex-direction:column;
    }
    canvas{
      background:black;
      border:4px solid #22c55e;
      border-radius:10px;
    }
  </style>
</head>
<body>

<h1>🐍 Jogo da Cobrinha</h1>
<canvas id="jogo" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById('jogo');
const ctx = canvas.getContext('2d');

let cobra = [{x: 200, y: 200}];
let dx = 20;
let dy = 0;

let comida = {
  x: 100,
  y: 100
};

let pontos = 0;

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' && dx === 0) {
    dx = -20;
    dy = 0;
  }
  if (e.key === 'ArrowRight' && dx === 0) {
    dx = 20;
    dy = 0;
  }
  if (e.key === 'ArrowUp' && dy === 0) {
    dx = 0;
    dy = -20;
  }
  if (e.key === 'ArrowDown' && dy === 0) {
    dx = 0;
    dy = 20;
  }
});

function gameOver() {
  alert('💀 Game Over! Pontos: ' + pontos);
  cobra = [{x: 200, y: 200}];
  dx = 20;
  dy = 0;
  pontos = 0;
  comida = {
    x: Math.floor(Math.random() * 20) * 20,
    y: Math.floor(Math.random() * 20) * 20
  };
}

function loop() {
  ctx.fillStyle = 'black';
  ctx.fillRect(0, 0, 400, 400);

  const cabeca = {
    x: cobra[0].x + dx,
    y: cobra[0].y + dy
  };

  // COLISÃO COM PAREDE
  if (
    cabeca.x < 0 ||
    cabeca.x >= 400 ||
    cabeca.y < 0 ||
    cabeca.y >= 400
  ) {
    gameOver();
    return;
  }

  // COLISÃO COM O PRÓPRIO CORPO
  for (let parte of cobra) {
    if (cabeca.x === parte.x && cabeca.y === parte.y) {
      gameOver();
      return;
    }
  }

  cobra.unshift(cabeca);

  // COME COMIDA
  if (cabeca.x === comida.x && cabeca.y === comida.y) {
    pontos++;

    comida = {
      x: Math.floor(Math.random() * 20) * 20,
      y: Math.floor(Math.random() * 20) * 20
    };
  } else {
    cobra.pop();
  }

  // DESENHA COMIDA
  ctx.fillStyle = 'red';
  ctx.fillRect(comida.x, comida.y, 20, 20);

  // DESENHA COBRA
  ctx.fillStyle = '#22c55e';
  cobra.forEach(p => {
    ctx.fillRect(p.x, p.y, 20, 20);
  });

  // PONTOS
  ctx.fillStyle = 'white';
  ctx.font = '16px Arial';
  ctx.fillText('Pontos: ' + pontos, 10, 20);
}

setInterval(loop, 120);
</script>

</body>
</html>
